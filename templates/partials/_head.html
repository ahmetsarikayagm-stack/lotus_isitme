{% load static %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EF7B18">
<link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
<link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
{# Geliştirme için Tailwind CDN. Production'da Tailwind CLI ile derlenmiş CSS'e geçilecek. #}
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'] },
        colors: {
          /* Lotus logosundaki turuncu (#EF7B18) */
          brand: {
            50: '#FEF4EA', 100: '#FDE6CF', 200: '#FBCB9F', 300: '#F8AB6A', 400: '#F39440',
            500: '#EF7B18', 600: '#D9660C', 700: '#B4510C', 800: '#8F4012', 900: '#753611'
          }
        }
      }
    }
  }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>[x-cloak]{display:none!important}</style>
